<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student E-Commerce Portal</title>
    <style>
        /* BASE SYSTEM STYLES */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        
        .hidden { display: none !important; }
        
        /* --- LOGIN SCREEN (Screenshot 259) --- */
        .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f1f5f9; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 440px; border: 1px solid #e2e8f0; }
        .login-card h2 { color: #1e3a8a; margin-bottom: 24px; font-size: 26px; font-weight: 700; text-align: center; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 14px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        .form-group input:focus { border-color: #1e3a8a; background-color: white; }
        .login-btn { width: 100%; padding: 14px; background-color: #1e3a8a; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .login-btn:hover { background-color: #172554; }
        .forgot-link { display: block; text-align: center; margin-top: 20px; color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: 500; }

        /* --- NAVIGATION HEADER & SIDEBAR --- */
        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1e3a8a; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        header h1 { font-size: 20px; font-weight: 600; }
        .menu-toggle { font-size: 24px; cursor: pointer; background: none; border: none; color: white; padding: 4px; }
        
        .sidebar { position: fixed; top: 60px; left: -100%; width: 280px; height: calc(100vh - 60px); background-color: #1e3a8a; color: white; transition: 0.3s ease; z-index: 999; padding-top: 16px; box-shadow: 4px 0 10px rgba(0,0,0,0.1); }
        .sidebar.active { left: 0; }
        .sidebar-item { padding: 14px 24px; display: flex; align-items: center; cursor: pointer; font-size: 15px; color: #e2e8f0; border-left: 4px solid transparent; transition: 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { background-color: rgba(255,255,255,0.08); color: #fbbf24; border-left-color: #fbbf24; font-weight: 600; }
        .sidebar-item.logout { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); }
        
        .main-content { padding: 24px; flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; }
        .page-title { color: #1e3a8a; font-size: 24px; font-weight: 700; margin-bottom: 24px; }

        /* --- HOMEPAGE / DASHBOARD --- */
        .welcome-banner { background: white; padding: 24px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #e2e8f0; }
        .welcome-banner h2 { color: #1e3a8a; font-size: 22px; margin-bottom: 6px; }
        .welcome-banner p { color: #64748b; font-size: 15px; }
        .dashboard-grid { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
        .left-panel { flex: 2; min-width: 300px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 24px; }
        .left-panel h3 { color: #1e3a8a; margin-bottom: 16px; font-size: 18px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .material-list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #f1f5f9; }
        .material-list-item:last-child { border-bottom: none; }
        .material-info h4 { font-size: 15px; color: #0f172a; margin-bottom: 4px; font-weight: 600; }
        .badge { display: inline-block; padding: 4px 8px; font-size: 11px; border-radius: 6px; font-weight: 600; background-color: #dbeafe; color: #1e40af; }
        .badge.uniform { background-color: #f3e8ff; color: #6b21a8; }
        .material-price { font-weight: 700; font-size: 15px; color: #0f172a; }
        
        .right-panel { flex: 1; min-width: 280px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.01); }
        .right-panel h3 { color: #1e3a8a; font-size: 18px; margin-bottom: 16px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 15px; color: #475569; }
        .summary-row.total { font-size: 20px; font-weight: 700; color: #0f172a; border-top: 1px solid #e2e8f0; padding-top: 14px; margin-top: 14px; }
        .action-btn { width: 100%; padding: 12px; background-color: #d97706; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; margin-top: 10px; transition: 0.2s; }
        .action-btn:hover { background-color: #b45309; }

        /* --- SHOP SECTIONS --- */
        .shop-layout { display: flex; gap: 24px; flex-wrap: wrap; }
        .filter-sidebar { width: 260px; min-width: 240px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px; height: fit-content; }
        .filter-sidebar h3 { color: #1e3a8a; font-size: 16px; margin-bottom: 16px; font-weight: 700; }
        .filter-group { margin-bottom: 16px; }
        .filter-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .filter-group select, .filter-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; background-color: #f8fafc; font-size: 14px; outline: none; }
        .products-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }
        .product-img-placeholder { height: 180px; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; color: #64748b; font-size: 13px; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .product-details { padding: 16px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .product-details h4 { font-size: 14px; color: #0f172a; margin-bottom: 8px; line-height: 1.4; font-weight: 600; }
        .product-details .price { font-size: 16px; font-weight: 700; color: #1e3a8a; margin-bottom: 8px; }
        .stock-badge { display: inline-block; align-self: flex-start; padding: 3px 8px; font-size: 11px; font-weight: 600; border-radius: 4px; }
        .stock-badge.in { background-color: #d1fae5; color: #065f46; }
